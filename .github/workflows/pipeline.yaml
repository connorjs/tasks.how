name: Pipeline
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  CiBuild:
    name: CI Build
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Checkout self
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # Full depth (not shallow) for GitVersion
      - name: Use .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true
      - name: Restore
        run: |
          dotnet tool restore
          dotnet restore
      - name: Format
        run: dotnet csharpier check .
      - name: Bazel Format
        run: bazel run //:format.check
      - name: Build
        run: dotnet build --configuration Release --no-restore
      - name: Bazel Test
        run: bazel test //...
